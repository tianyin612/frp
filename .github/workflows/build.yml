name: build

# Default: unsigned artifacts, works on any push / manual dispatch.
# If the optional secrets below are configured, the same workflow upgrades
# itself to signed (and on macOS notarized) artifacts.
#
# Optional secrets:
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
#   WIN_CERT_PFX_BASE64 / WIN_CERT_PASSWORD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_VERSION: "0.52.3"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Fetch frpc sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:FRP_VERSION
          $url = "https://github.com/fatedier/frp/releases/download/v$v/frp_${v}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\frp.zip"
          Expand-Archive -Path "$env:TEMP\frp.zip" -DestinationPath "$env:TEMP\frp" -Force
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          Copy-Item "$env:TEMP\frp\frp_${v}_windows_amd64\frpc.exe" `
            -Destination "src-tauri\binaries\frpc-x86_64-pc-windows-msvc.exe"
          & "src-tauri\binaries\frpc-x86_64-pc-windows-msvc.exe" -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Icons
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "src-tauri\icons\icon.ico")) {
            if (Test-Path "logo.png") { pnpm tauri icon ./logo.png }
            else { Write-Host "::error::logo.png missing"; exit 1 }
          }

      - name: Preflight
        run: pnpm preflight

      - name: Restore signing cert
        if: env.WIN_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          "WIN_CERT_PFX=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (signed)
        if: env.WIN_CERT_PFX_BASE64 != ''
        run: pnpm release:win

      - name: Build (unsigned)
        if: env.WIN_CERT_PFX_BASE64 == ''
        run: pnpm tauri build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # --------------------------------------------------------------- macOS
  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            frp_platform: darwin_arm64
          - target: x86_64-apple-darwin
            frp_platform: darwin_amd64
    env:
      TARGET: ${{ matrix.target }}
      # Do NOT export APPLE_SIGNING_IDENTITY at job level. When the secret is
      # missing, GitHub still exports it as an empty string and Tauri then runs
      # `codesign --sign ""`, which fails with:
      #   error: The specified item could not be found in the keychain.
      HAS_APPLE_CERT: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Fetch frpc sidecar
        env:
          FRP_PLATFORM: ${{ matrix.frp_platform }}
        run: |
          set -euo pipefail
          v="$FRP_VERSION"
          url="https://github.com/fatedier/frp/releases/download/v$v/frp_${v}_${FRP_PLATFORM}.tar.gz"
          curl -fsSL "$url" -o /tmp/frp.tar.gz
          tar -xzf /tmp/frp.tar.gz -C /tmp
          mkdir -p src-tauri/binaries
          cp "/tmp/frp_${v}_${FRP_PLATFORM}/frpc" "src-tauri/binaries/frpc-${TARGET}"
          chmod +x "src-tauri/binaries/frpc-${TARGET}"
          "src-tauri/binaries/frpc-${TARGET}" -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Icons
        run: |
          set -euo pipefail
          if [ ! -f src-tauri/icons/icon.icns ]; then
            [ -f logo.png ] || { echo "::error::logo.png missing"; exit 1; }
            pnpm tauri icon ./logo.png
          fi

      - name: Preflight
        run: pnpm preflight

      - name: Import signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | openssl base64 -d -A -out /tmp/cert.p12
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import /tmp/cert.p12 -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Build + sign + notarize
        if: env.HAS_APPLE_CERT == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm release:mac

      - name: Build (unsigned)
        if: env.HAS_APPLE_CERT != 'true'
        shell: bash
        run: |
          set -o pipefail
          # Build only the .app bundle. Tauri's DMG step drives Finder through
          # AppleScript and is the most fragile part on CI; we build the DMG
          # ourselves in the next step.
          if pnpm tauri build --target "$TARGET" --bundles app 2>&1 | tee build-unsigned.log; then
            exit 0
          fi
          echo "--- build tail ---"
          tail -n 40 build-unsigned.log
          MSG=$(tail -n 40 build-unsigned.log | sed 's/%/%25/g' | tr -d '\r' | awk 'BEGIN{ORS=""} {if(NR>1) printf "%%0A"; print}')
          echo "::error title=macos build failed::$MSG"
          exit 1

      - name: Package DMG (unsigned)
        if: env.HAS_APPLE_CERT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(ls -d src-tauri/target/$TARGET/release/bundle/macos/*.app | head -1)
          echo "app: $APP"
          # ad-hoc sign: an unsigned arm64 bundle is killed by AMFI on launch
          codesign --force --deep --sign - --options runtime "$APP" || echo "adhoc sign failed (non-fatal)"
          codesign -dv --verbose=4 "$APP" 2>&1 | head -6 || true
          mkdir -p dist-mac
          hdiutil create -volname frpc-desktop -srcfolder "$APP" -ov -format UDZO \
            "dist-mac/frpc-desktop_${TARGET}.dmg"
          ls -la dist-mac

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist-mac/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
