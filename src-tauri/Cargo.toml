[package]
name = "frpc-desktop"
version = "0.1.0"
description = "frp client desktop GUI"
authors = ["you"]
edition = "2021"
# tauri-plugin-autostart 2.7 要求 rustc >= 1.90（官方文档标注），
# 这里如实声明，避免用旧工具链的人看到莫名其妙的依赖报错。
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘菜单；不开 tray-icon 的话 TrayIconBuilder 编译不过
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"

[profile.release]
# 注意：这里不用 lto=true / codegen-units=1。
# 在 rustc 1.99 + 本机这套 MSVC 上，全量 LTO 会让 rustc 直接 0xc0000005 崩掉；
# thin/off 既稳又明显更快，对 GUI 体积影响很小。
codegen-units = 16
lto = false
opt-level = "s"
panic = "abort"
strip = true
